<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenes+</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  body { overflow: hidden; }
  #grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px; padding: 8px; align-content: start; grid-auto-rows: max-content; }
  .card { display: flex; flex-direction: column; min-height: max-content; position: relative; background: var(--panel); border: 2px solid var(--border); border-radius: 8px;
    overflow: hidden; cursor: pointer; user-select: none; transition: border-color .1s; }
  .card:hover { border-color: #4a4d5c; }
  .card.program { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card.preview { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
  .thumb { flex: none; aspect-ratio: 16/9; background: #0d0e12; display: flex; align-items: center; justify-content: center; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .ph { color: var(--muted); font-size: .8em; }
  .foot { display: flex; align-items: center; gap: 4px; padding: 4px 6px; }
  .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: .9em; }
  .tag { position: absolute; top: 5px; left: 5px; font-size: .68em; font-weight: 800; padding: 1px 6px; border-radius: 4px; }
  .tag.cur { background: var(--accent); color: #fff; } .tag.pv { background: var(--ok); color: #08130b; }
  .rule { border: 1px solid var(--border); background: var(--panel2); border-radius: 5px; padding: 0 4px;
    font-size: .8em; line-height: 1.5; cursor: pointer; min-width: 26px; text-align: center; }
  .rule.on { background: #14532d; border-color: #22c55e; }
  .rule.off { background: #5f1d21; border-color: #ef4444; }
  .rule.none { opacity: .45; }
  .thumb { position: relative; }
  .note { position: absolute; left: 4px; bottom: 4px; font-size: .64em; padding: 1px 5px; border-radius: 4px;
    background: rgba(0,0,0,.7); color: #c9cbd3; pointer-events: none; }
  .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 6px; font-size: .7em; color: var(--muted); pointer-events: none; }
  .pick { display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow: auto; margin: 6px 0; }
  .pick button { text-align: left; display: flex; gap: 8px; align-items: center; padding: 6px 8px; }
  .pick button b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .pick button small { color: var(--muted); white-space: nowrap; }
  .sec { font-size: .75em; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 8px; }
  .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9em; margin: 4px 0; }
  .ok { color: var(--ok); } .warn { color: var(--warn); }
  #legend { padding: 0 8px 6px; font-size: .75em; color: var(--muted); flex: none; }
</style>
</head>
<body>
<div class="bar">
  <span id="pill" class="pill"><span class="dot"></span>…</span>
  <span id="mode" class="muted small grow" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
  <button id="go" class="primary" hidden title="Switch to the green preview scene">Transition ▶</button>
</div>
<div id="grid"></div>
<div id="legend"></div>
<script src="/static/common.js"></script>
<script>
let st = { scenes: [], inputs: {}, specials: [], rules: {} }; const thumbs = {};
const ICON = k => /input_capture/.test(k) ? '🎙' : '🔈';

function ruleBtn(scene, name) {
  const v = ((st.rules || {})[scene] || {})[name] || '';
  const b = el('span', 'rule ' + (v || 'none'), ICON((st.inputs[name] || {}).kind) + (v === 'off' ? '✕' : v === 'on' ? '✓' : ''));
  b.title = name + ' in "' + scene + '": ' + (v === 'on' ? 'always ON when you switch to this scene'
    : v === 'off' ? 'always MUTED when you switch to this scene' : 'left as it is') + '\n(click to change)';
  b.onclick = e => {
    e.stopPropagation();
    const next = v === '' ? 'on' : v === 'on' ? 'off' : '';
    api('/api/obs/rule', { scene, name, value: next }).catch(err => toast(err.message, true));
  };
  return b;
}

function draw() {
  const g = $('#grid');
  if (!st.connected && !(st.scenes && st.scenes.length)) {
    g.innerHTML = '<div class="notice" style="grid-column:1/-1"></div>';
    $('.notice').textContent = st.error || 'Connecting to OBS…'; $('#legend').textContent = ''; return;
  }
  g.classList.toggle('stale', !st.connected);   // keep showing the last scenes while reconnecting
  g.innerHTML = '';
  for (const s of st.scenes) {
    const c = el('div', 'card'); c.dataset.scene = s;
    if (s === st.program) c.classList.add('program');
    else if (st.studio && s === st.preview) c.classList.add('preview');
    const t = el('div', 'thumb');
    fillThumb(t, s);
    c.appendChild(t);
    if (s === st.program) { const tg = el('span', 'tag cur', 'CURRENT'); tg.title = 'The scene viewers see when you stream or record'; c.appendChild(tg); }
    else if (st.studio && s === st.preview) c.appendChild(el('span', 'tag pv', 'PREVIEW'));
    const f = el('div', 'foot'); f.appendChild(el('span', 'nm', s));
    for (const n of st.specials) f.appendChild(ruleBtn(s, n));
    c.appendChild(f);
    c.onclick = () => api('/api/obs/scene', { scene: s }).catch(e => toast(e.message, true));
    if (st.studio) c.ondblclick = () => api('/api/obs/transition', {}).catch(e => toast(e.message, true));
    g.appendChild(c);
  }
  $('#legend').textContent = st.specials.length
    ? 'Small buttons = what ' + st.specials.join(' / ') + ' do when you switch to a scene: dim = leave as is, ✓ = turn on, ✕ = mute.' : '';
}

function header() {
  const p = $('#pill');
  if (st.connected) { p.className = 'pill watching'; p.innerHTML = '<span class="dot"></span>OBS'; p.title = 'Connected to OBS'; }
  else if (st.reconnecting) { p.className = 'pill reconnect'; p.innerHTML = '<span class="dot"></span>Reconnecting…'; p.title = 'The OBSplit helper is restarting. This fixes itself.'; }
  else { p.className = 'pill'; p.innerHTML = '<span class="dot"></span>OBS offline'; p.title = st.error || ''; }
  $('#mode').textContent = st.connected ? (st.studio ? 'Studio Mode: click = preview, double-click or ▶ = switch' : 'Click a scene to switch to it') : '';
  $('#go').hidden = !(st.connected && st.studio);
}
$('#go').onclick = () => api('/api/obs/transition', {}).catch(e => toast(e.message, true));

function fillThumb(t, s) {
  const th = thumbs[s];
  t.innerHTML = '';
  if (!th) { t.appendChild(el('span', 'ph', 'Loading preview…')); return; }
  const i = el('img'); i.src = th.img; t.appendChild(i);
  const live = s === st.program || (st.studio && s === st.preview);
  if (th.stale && !live) t.appendChild(el('span', 'note', 'last seen'));
}

function updateThumb(scene, th) {
  thumbs[scene] = th;
  const c = document.querySelector('.card[data-scene="' + CSS.escape(scene) + '"] .thumb');
  if (!c) return;
  const img = c.querySelector('img');
  if (img && !th.stale && !c.querySelector('.note')) { img.src = th.img; return; }
  fillThumb(c, scene);
}

(function open() {
  const es = new EventSource('/obs-events?view=scenes');
  es.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.type === 'state') { Object.assign(thumbs, ev.thumbs || {}); st = ev; header(); draw(); }
    else if (ev.type === 'thumb') updateThumb(ev.scene, { img: ev.img, stale: ev.stale, dark: ev.dark });
  };
  es.onerror = () => { es.close(); st = { ...st, connected: false, reconnecting: true }; header(); draw(); setTimeout(open, 1000); };
})();
</script>
</body>
</html>
