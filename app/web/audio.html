<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio+</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
  .seg button { border: 0; border-radius: 0; padding: 2px 9px; font-size: .82em; }
  .seg button.on { background: var(--accent); color: #fff; }
  .pane { flex: 1; overflow-y: auto; }
  /* ---- mixer */
  #list { padding: 6px 8px; display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); align-content: start; }
  .src { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .src.muted, .src.silent { opacity: .6; }
  .l1 { display: flex; align-items: center; gap: 6px; }
  .nm { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nm small { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .db { font-size: .78em; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 50px; text-align: right; }
  .ib { font-size: .82em; white-space: nowrap; }
  .ib.on { color: #8fb4ff; }
  .mute.on { color: #ff6b70; }
  .fader { position: relative; height: 22px; margin: 5px 0 4px; }
  .meter { position: absolute; left: 0; right: 0; top: 8px; height: 6px; border-radius: 3px; overflow: hidden;
    background: linear-gradient(90deg, #1f9d55 0%, #1f9d55 66%, #d9a400 66%, #d9a400 87%, #e5484d 87%); }
  .meter .cover { position: absolute; top: 0; right: 0; bottom: 0; background: #2a2c36; width: 100%; transition: width .08s linear; }
  .fader input { position: absolute; inset: 0; width: 100%; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; }
  .fader input::-webkit-slider-runnable-track { height: 22px; background: transparent; }
  .fader input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 20px; margin-top: 1px; border-radius: 3px;
    background: #e6e6ea; border: 1px solid #555; cursor: pointer; }
  .l3 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: .8em; }
  .tog { padding: 1px 8px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
  .tog.on { background: #1d3f8a; border-color: var(--accent); color: #fff; }
  .l3 select { font-size: 1em; padding: 1px 4px; max-width: 170px; }
  .silentbar { grid-column: 1 / -1; font-size: .78em; color: var(--muted); cursor: pointer; padding: 4px 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .silentbar:hover { color: var(--text); }
  /* ---- mix check */
  #mix { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .card h4 { margin: 0 0 4px; font-size: .95em; display: flex; align-items: center; gap: 8px; }
  .card p { margin: 2px 0 0; font-size: .8em; color: var(--muted); }
  .switch { position: relative; width: 38px; height: 20px; border-radius: 99px; background: #3a3c48; cursor: pointer; flex: none; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--ok); } .switch.on::after { left: 20px; }
  .bal { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; font-size: .82em; margin-top: 6px; }
  .bar { height: 10px; border-radius: 5px; background: #2a2c36; overflow: hidden; }
  .bar > div { height: 100%; transition: width .2s; }
  .verdict { font-weight: 700; margin-top: 6px; }
  .v-good { color: var(--ok); } .v-low, .v-quiet { color: var(--warn); } .v-bad { color: var(--danger); } .v-wait { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; font-size: .82em; padding: 3px 0; border-top: 1px solid rgba(255,255,255,.05); }
  .row .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .mini { width: 70px; height: 6px; border-radius: 3px; background: #2a2c36; overflow: hidden; flex: none; }
  .row .mini > div { height: 100%; background: #6aa0ff; }
  .tag { font-size: .72em; padding: 0 5px; border-radius: 4px; background: #3f2a78; }
  audio { width: 100%; margin-top: 6px; }
</style>
</head>
<body>
<div class="bar">
  <span id="pill" class="pill"><span class="dot"></span>…</span>
  <span class="seg"><button id="tMixer" class="on">Mixer</button><button id="tMix">Mix check</button></span>
  <span class="grow"></span>
  <span class="seg" id="viewSeg"><button id="vScene" class="on" title="Only sources in the current scene, plus Mic and Desktop Audio">This scene</button><button id="vAll" title="Every source with audio">All</button></span>
</div>
<div class="pane" id="mixerPane"><div id="list"></div></div>
<div class="pane" id="mixPane" hidden><div id="mix"></div></div>
<script src="/static/common.js"></script>
<script>
let st = { inputs: {}, specials: [], members: [], rec_tracks: [], track_names: {} }, view = 'scene', tab = 'mixer', mix = null;
const dragging = new Set();
const posToDb = p => p <= 0 ? -100 : Math.max(-100, 60 * Math.log10(p));
const dbToPos = db => db <= -100 ? 0 : Math.min(1, Math.pow(10, db / 60));
const KIND = { wasapi_input_capture: 'mic', wasapi_output_capture: 'desktop', wasapi_process_output_capture: 'app',
  ffmpeg_source: 'media', vlc_source: 'playlist', browser_source: 'browser', dshow_input: 'capture card',
  game_capture: 'game', window_capture: 'window' };
const MON = { none: 'OBS_MONITORING_TYPE_NONE', both: 'OBS_MONITORING_TYPE_MONITOR_AND_OUTPUT', only: 'OBS_MONITORING_TYPE_MONITOR_ONLY' };
const send = body => api('/api/obs/input', body).catch(e => toast(e.message, true));
const volTimer = {};
function sendVol(name, db) { clearTimeout(volTimer[name]); volTimer[name] = setTimeout(() => send({ name, db }), 60); }
const streamTrack = () => String(st.stream_track || 1);
const recTracks = () => st.rec_tracks.filter(t => String(t) !== streamTrack());

// ================= Mixer
function names() {
  const all = Object.keys(st.inputs);
  const inView = view === 'all' ? all : all.filter(n => st.specials.includes(n) || st.members.includes(n));
  const sort = arr => arr.sort((a, b) => (st.specials.includes(b) - st.specials.includes(a)) || a.localeCompare(b));
  return { loud: sort(inView.filter(n => st.inputs[n].audible !== false)), silent: sort(inView.filter(n => st.inputs[n].audible === false)) };
}

function recSelect(name, i) {
  const s = el('select'); s.title = 'Which recording track this source is saved on';
  const on = recTracks().filter(t => (i.tracks || {})[String(t)]);
  const add = (v, label) => { const o = el('option', null, label); o.value = v; s.appendChild(o); };
  add('off', 'Recording: off');
  for (const t of recTracks()) add(String(t), 'Recording: ' + (st.track_names[t] || 'track ' + t) + ' track');
  if (recTracks().length > 1) add('all', 'Recording: all tracks');
  let cur = 'off';
  if (on.length === 1) cur = String(on[0]);
  else if (on.length && on.length === recTracks().length) cur = 'all';
  else if (on.length) { add('custom', 'Recording: ' + on.map(t => st.track_names[t] || t).join(' + ')); cur = 'custom'; s.lastChild.disabled = true; }
  s.value = cur;
  s.onchange = () => {
    const tracks = {};
    for (const t of recTracks()) tracks[String(t)] = s.value === 'all' || s.value === String(t);
    send({ name, tracks });
  };
  return s;
}

function row(name) {
  const i = st.inputs[name];
  const r = el('div', 'src' + (i.muted ? ' muted' : '')); r.dataset.name = name;
  const l1 = el('div', 'l1');
  const mute = icoBtn(i.muted ? 'speakerOff' : 'speaker', i.muted ? 'Muted. Click to unmute' : 'Click to mute',
    () => send({ name, muted: !i.muted }), null, 'mute' + (i.muted ? ' on' : ''));
  const nm = el('span', 'nm', name); nm.appendChild(el('small', null, KIND[i.kind] || '')); nm.title = name;
  const db = el('span', 'db', i.db <= -100 ? '-inf dB' : i.db.toFixed(1) + ' dB');
  const monOn = i.monitor !== MON.none;
  const mon = icoBtn('headphones', monOn ? 'You hear this in your headphones. Click to stop.' : "You don't hear this through OBS. Click to hear it in your headphones.",
    () => send({ name, monitor: monOn ? MON.none : MON.both }), null, monOn ? 'on' : '');
  l1.append(mute, nm, db);
  if (i.kind === 'wasapi_input_capture') {
    l1.appendChild(icoBtn('gear', 'Microphone settings: device, noise removal, evening out, boost', () => openMic(name)));
  }
  l1.appendChild(mon);

  const f = el('div', 'fader');
  const meter = el('div', 'meter'); meter.appendChild(el('div', 'cover'));
  const sl = el('input'); sl.type = 'range'; sl.min = 0; sl.max = 1000; sl.value = Math.round(dbToPos(i.db) * 1000);
  sl.title = 'Volume (double-click = 0 dB)';
  sl.oninput = () => { dragging.add(name); const d = posToDb(sl.value / 1000); db.textContent = d <= -100 ? '-inf dB' : d.toFixed(1) + ' dB'; sendVol(name, d); };
  sl.onchange = () => setTimeout(() => dragging.delete(name), 400);
  sl.ondblclick = () => { sl.value = 1000; send({ name, db: 0 }); };
  f.append(meter, sl);

  const l3 = el('div', 'l3');
  const onStream = !!(i.tracks || {})[streamTrack()];
  const t = el('span', 'tog' + (onStream ? ' on' : ''), onStream ? 'On stream' : 'Not on stream');
  t.title = onStream ? 'Viewers hear this. Click to keep it off the stream.' : "Viewers don't hear this. Click to put it on the stream.";
  t.onclick = () => send({ name, track: Number(streamTrack()), on: !onStream });
  l3.appendChild(t);
  if (recTracks().length) l3.appendChild(recSelect(name, i));
  r.append(l1, f, l3);
  return r;
}

function drawMixer() {
  const list = $('#list');
  if (!st.connected && !Object.keys(st.inputs || {}).length) {
    list.innerHTML = '<div class="notice"></div>'; $('.notice', list).textContent = st.error || 'Connecting to OBS…'; return;
  }
  list.classList.toggle('stale', !st.connected);   // keep showing the last mixer while reconnecting
  $('#mix').classList.toggle('stale', !st.connected);
  list.innerHTML = '';
  const { loud, silent } = names();
  const keepOrMake = n => {
    const keep = dragging.has(n) && document.querySelector('.src[data-name="' + CSS.escape(n) + '"]');
    const r = keep || row(n); if (silent.includes(n)) r.classList.add('silent'); return r;
  };
  for (const n of loud) list.appendChild(keepOrMake(n));
  if (!loud.length) list.appendChild(el('div', 'notice', 'No sound sources in this scene.'));
  if (silent.length) {
    const t = el('div', 'silentbar');
    t.textContent = silent.length + ' without sound (' + (showSilent ? 'hide' : 'show') + '): ' + silent.join(', ');
    t.title = 'Videos with no or silent soundtrack, browser sources not set to "Control audio via OBS", and captures with "Capture audio" off.';
    t.onclick = () => { showSilent = !showSilent; drawMixer(); };
    list.appendChild(t);
    if (showSilent) for (const n of silent) list.appendChild(keepOrMake(n));
  }
}
let showSilent = false;

// ================= Mic settings
let micOpen = null;
const EVEN = { light: { ratio: 2.0, threshold: -16.0 }, medium: { ratio: 4.0, threshold: -18.0 }, strong: { ratio: 6.0, threshold: -24.0 } };

async function openMic(name) {
  let d; try { d = await api('/api/obs/mic?name=' + encodeURIComponent(name)); } catch (e) { return toast(e.message, true); }
  const bg = el('div', 'modal-bg'), m = el('div', 'modal');
  const close = () => { bg.remove(); micOpen = null; };
  bg.onclick = e => { if (e.target === bg) close(); };
  document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } });
  bg.appendChild(m); document.body.appendChild(bg); micOpen = name;
  const set = async body => {
    try { d = await api('/api/obs/mic', { name, ...body }); render(); } catch (e) { toast(e.message, true); }
  };
  const sw = (on, fn) => { const s = el('span', 'switch' + (on ? ' on' : '')); s.onclick = fn; return s; };
  const line = (label, help, ...ctrls) => {
    const c = el('div'); c.style.cssText = 'padding:7px 0;border-top:1px solid var(--border)';
    const h = el('div'); h.style.cssText = 'display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9em';
    h.append(...ctrls.filter(x => x && x.classList && x.classList.contains('switch')), el('span', null, label));
    c.appendChild(h);
    if (help) { const p = el('div', 'muted small', help); p.style.marginTop = '2px'; c.appendChild(p); }
    for (const x of ctrls) if (x && !(x.classList && x.classList.contains('switch'))) { x.style.marginTop = '4px'; c.appendChild(x); }
    return c;
  };
  const slider = (min, max, step, val, unit, fn) => {
    const w = el('div'); w.style.cssText = 'display:flex;gap:8px;align-items:center';
    const r = el('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = val; r.style.flex = '1';
    const v = el('span', 'db', (+val).toFixed(0) + ' ' + unit);
    let t; r.oninput = () => { v.textContent = (+r.value).toFixed(0) + ' ' + unit; clearTimeout(t); t = setTimeout(() => fn(+r.value), 250); };
    w.append(r, v); return w;
  };

  function render() {
    m.innerHTML = '';
    m.appendChild(el('h3', null, name + ' settings'));
    const f = k => d.filters.find(x => x.kind === k);
    // device + level
    const dev = el('select'); dev.style.width = '100%';
    for (const x of d.devices) { const o = el('option', null, x.name); o.value = x.value; dev.appendChild(o); }
    dev.value = d.device; dev.onchange = () => set({ action: 'device', value: dev.value });
    const meter = el('div', 'meter'); meter.id = 'micMeter'; meter.style.cssText = 'position:relative;height:8px;margin-top:6px';
    meter.appendChild(el('div', 'cover'));
    m.appendChild(line('Microphone', 'Talk to check the level: aim for mostly green, touching yellow when you speak up.', dev, meter));
    // boost
    const gain = f('gain_filter'), gOn = !!(gain && gain.enabled);
    m.appendChild(line('Boost', 'Make a quiet mic louder (or a hot mic quieter) before the other settings.',
      sw(gOn, () => set({ action: 'filter', kind: 'gain_filter', enabled: !gOn })),
      gOn ? slider(-10, 20, 1, (gain.settings.db ?? 0), 'dB', v => set({ action: 'filter', kind: 'gain_filter', settings: { db: v } })) : null));
    // noise gate
    const gate = f('noise_gate_filter'), gtOn = !!(gate && gate.enabled);
    m.appendChild(line('Cut out quiet noise', 'Silences the mic completely below a level (keyboard, fans). Raise it if noise gets through; lower it if your words get cut.',
      sw(gtOn, () => set({ action: 'filter', kind: 'noise_gate_filter', enabled: !gtOn })),
      gtOn ? slider(-60, -25, 1, (gate.settings.open_threshold ?? -42), 'dB', v => set({ action: 'filter', kind: 'noise_gate_filter', settings: { open_threshold: v, close_threshold: v - 6 } })) : null));
    // noise suppression
    const ns = f('noise_suppress_filter'), nsOn = !!(ns && ns.enabled);
    let method = null;
    if (nsOn) {
      method = el('select');
      for (const [v, t] of [['rnnoise', 'Best quality (RNNoise)'], ['speex', 'Lighter on CPU (Speex)'], ['nvafx_denoiser', 'NVIDIA Broadcast (if installed)']]) { const o = el('option', null, t); o.value = v; method.appendChild(o); }
      method.value = ns.settings.method || 'rnnoise';
      method.onchange = () => set({ action: 'filter', kind: 'noise_suppress_filter', settings: { method: method.value } });
    }
    m.appendChild(line('Remove background noise', 'Cleans up hum, fans and room noise from your voice.',
      sw(nsOn, () => set({ action: 'filter', kind: 'noise_suppress_filter', enabled: !nsOn })), method));
    // compressor
    const comp = f('compressor_filter'), cOn = !!(comp && comp.enabled);
    const ev = el('select');
    for (const [v, t] of [['off', 'Off'], ['light', 'Light'], ['medium', 'Medium (recommended)'], ['strong', 'Strong']]) { const o = el('option', null, t); o.value = v; ev.appendChild(o); }
    const r = comp ? (comp.settings.ratio ?? 4) : 4;
    ev.value = !cOn ? 'off' : r <= 2.5 ? 'light' : r <= 5 ? 'medium' : 'strong';
    ev.onchange = () => ev.value === 'off' ? set({ action: 'filter', kind: 'compressor_filter', enabled: false })
      : set({ action: 'filter', kind: 'compressor_filter', enabled: true, settings: EVEN[ev.value] });
    m.appendChild(line('Even out my voice', 'Brings quiet words up and loud moments down, so viewers don\'t have to change their volume.', ev));
    // limiter
    const lim = f('limiter_filter'), lOn = !!(lim && lim.enabled);
    m.appendChild(line('Stop clipping', 'A safety net: shouts and laughs never distort.',
      sw(lOn, () => set({ action: 'filter', kind: 'limiter_filter', enabled: !lOn }))));
    // other filters
    const known = ['gain_filter', 'noise_gate_filter', 'noise_suppress_filter', 'compressor_filter', 'limiter_filter'];
    const others = d.filters.filter(x => !known.includes(x.kind));
    if (others.length) m.appendChild(line('Other filters', others.map(x => x.name + (x.enabled ? '' : ' (off)')).join(', ')));
    const btns = el('div', 'row-flex'); btns.style.marginTop = '10px';
    const b1 = el('button', null, 'All filters…'); b1.onclick = () => set({ action: 'open', dialog: 'filters' });
    const b2 = el('button', null, 'Device properties…'); b2.onclick = () => set({ action: 'open', dialog: 'properties' });
    const b3 = el('button', 'primary', 'Done'); b3.onclick = close;
    btns.append(b1, b2, el('span', 'grow'), b3); m.appendChild(btns);
  }
  render();
}

function meters(m) {
  if (micOpen) {
    const cov = document.querySelector('#micMeter .cover'), d = m[micOpen];
    if (cov) cov.style.width = (100 - Math.max(0, Math.min(1, ((d ?? -100) + 60) / 60)) * 100) + '%';
  }
  for (const r of document.querySelectorAll('.src')) {
    const d = m[r.dataset.name]; const cov = r.querySelector('.cover'); if (!cov) continue;
    const lvl = d == null ? 0 : Math.max(0, Math.min(1, (d + 60) / 60));
    cov.style.width = (100 - lvl * 100) + '%';
  }
}

// ================= Mix check
const pct = d => d == null ? 0 : Math.max(0, Math.min(100, (d + 60) / 60 * 100));
const dbs = d => d == null ? '—' : d.toFixed(0) + ' dB';
let mixBuilt = false, checkKey = '';

function buildMix() {
  const m = $('#mix'); m.innerHTML = `
  <div class="card">
    <h4><span class="switch" id="sAuto"></span> Keep my voice on top</h4>
    <p>Everything else on the stream stays at least <b id="gapV">10</b> dB below your voice, all the time, including anything you add later.
       Nothing gets louder when you stop talking. Turning this off puts your volumes back.</p>
    <input type="range" id="gap" min="6" max="16" step="1" style="width:100%;margin-top:6px" title="How far below your voice everything else stays">
    <div style="display:flex;justify-content:space-between;font-size:.75em;color:var(--muted)"><span>← Game louder</span><span>Voice clearer →</span></div>
  </div>
  <div class="card">
    <h4>Right now</h4>
    <div class="bal">
      <span>Your voice</span><div class="bar"><div id="bVoice" style="background:#3fb950"></div></div><span id="nVoice">—</span>
      <span>Everything else</span><div class="bar"><div id="bBg" style="background:#6aa0ff"></div></div><span id="nBg">—</span>
    </div>
    <div class="verdict" id="verdict">…</div>
    <p id="gapNow"></p>
  </div>
  <div class="card">
    <h4>Hear what viewers hear</h4>
    <p>Records 15 seconds of exactly what goes out on the stream (only the stream audio), then plays it back here. Talk over your game while it records.</p>
    <div class="row-flex" style="margin-top:6px"><button id="rec" class="primary">Record a 15-second check</button><span id="recState" class="muted small"></span></div>
    <div id="player"></div>
  </div>
  <div class="card">
    <h4><span class="switch" id="sDuck"></span> Dip game while I talk <span class="muted small">(optional)</span></h4>
    <p>Separate from the above: game and music also dip a little while you're talking, then return when you stop.</p>
  </div>
  <div class="card">
    <h4>What's on the stream</h4>
    <div id="srcs"></div>
  </div>`;
  $('#sAuto').onclick = () => api('/api/obs/mix', { auto: !(mix && mix.settings.auto) }).then(r => toast(r.auto ? 'Your voice will stay on top' : 'Auto off: volumes put back')).catch(e => toast(e.message, true));
  $('#sDuck').onclick = () => api('/api/obs/mix', { duck: !(mix && mix.settings.duck) }).catch(e => toast(e.message, true));
  let gt; $('#gap').oninput = () => { $('#gapV').textContent = $('#gap').value; clearTimeout(gt); gt = setTimeout(() => api('/api/obs/mix', { gap: +$('#gap').value }), 300); };
  $('#rec').onclick = () => api('/api/obs/mixcheck', { seconds: 15 }).then(() => toast('Recording 15 seconds. Talk over your game now.')).catch(e => toast(e.message, true));
  mixBuilt = true;
}

function drawMix() {
  if (!mixBuilt) buildMix();
  if (!mix) return;
  const s = mix.settings;
  $('#sAuto').classList.toggle('on', s.auto); $('#sDuck').classList.toggle('on', s.duck);
  if (document.activeElement !== $('#gap')) { $('#gap').value = s.gap; $('#gapV').textContent = s.gap; }
  $('#bVoice').style.width = pct(mix.voice_db) + '%'; $('#nVoice').textContent = dbs(mix.voice_db);
  $('#bBg').style.width = pct(mix.bg_db) + '%'; $('#nBg').textContent = dbs(mix.bg_db);
  const v = $('#verdict'); v.textContent = mix.verdict; v.className = 'verdict v-' + mix.level;
  $('#gapNow').textContent = mix.gap == null ? '' : 'Your voice is ' + mix.gap.toFixed(0) + ' dB above everything else' +
    (mix.voice_live == null && mix.voice_db != null ? ' (using your usual voice level)' : '') + '.';
  // check recording
  const c = mix.check || {}; const rec = $('#rec'), rs = $('#recState');
  rec.disabled = c.state === 'recording' || c.state === 'saving';
  rs.textContent = c.state === 'recording' ? 'Recording… ' + Math.max(0, Math.ceil(c.until - Date.now() / 1000)) + ' s'
    : c.state === 'saving' ? 'Saving…' : c.state === 'error' ? 'Check failed: ' + c.error : '';
  const key = c.state === 'ready' ? c.file + c.t : '';
  if (key !== checkKey) {
    checkKey = key; const p = $('#player'); p.innerHTML = '';
    if (c.state === 'ready') {
      const a = el('audio'); a.controls = true; a.src = '/api/mixcheck/file?t=' + c.t;
      const help = el('div', 'muted small', 'This is what viewers heard.');
      a.onerror = () => { help.textContent = "This panel can't play the file. Use Open in player instead."; };
      const b1 = el('button', null, 'Open in player'); b1.onclick = () => api('/api/obs/mixcheck/open', {}).catch(e => toast(e.message, true));
      const b2 = el('button', null, 'Delete'); b2.onclick = () => api('/api/obs/mixcheck/delete', {}).then(() => toast('Check recording deleted'));
      const r = el('div', 'row-flex'); r.style.marginTop = '4px'; r.append(b1, b2, help);
      p.append(a, r); a.play().catch(() => {});
    }
  }
  // sources
  const box = $('#srcs'); box.innerHTML = '';
  if (!mix.sources.length) box.appendChild(el('p', null, 'Nothing else is on the stream right now.'));
  for (const x of mix.sources) {
    const r = el('div', 'row');
    const n = el('span', 'n', x.name); n.title = x.name;
    const mini = el('div', 'mini'); const fill = el('div'); fill.style.width = pct(x.now_db) + '%'; mini.appendChild(fill);
    const fd = el('span', 'db', x.fader == null ? '' : x.fader.toFixed(1) + ' dB');
    r.append(n, mini, fd);
    if (x.ducked) r.appendChild(el('span', 'tag', 'dips'));
    const sk = el('span', 'tog' + (x.skip ? ' on' : ''), x.skip ? 'Left alone' : 'Auto adjusts');
    sk.title = x.skip ? 'Auto never changes this one. Click to let Auto adjust it.' : 'Auto may turn this down. Click to leave it alone (e.g. alert sounds).';
    sk.onclick = () => api('/api/obs/mix', { skip: { name: x.name, on: !x.skip } }).catch(e => toast(e.message, true));
    r.appendChild(sk);
    box.appendChild(r);
  }
}

// ================= tabs + events
function setTab(t) {
  tab = t; $('#tMixer').classList.toggle('on', t === 'mixer'); $('#tMix').classList.toggle('on', t === 'mix');
  $('#mixerPane').hidden = t !== 'mixer'; $('#mixPane').hidden = t !== 'mix'; $('#viewSeg').style.visibility = t === 'mixer' ? 'visible' : 'hidden';
  if (t === 'mix') drawMix();
}
$('#tMixer').onclick = () => setTab('mixer'); $('#tMix').onclick = () => setTab('mix');
$('#vScene').onclick = () => { view = 'scene'; $('#vScene').classList.add('on'); $('#vAll').classList.remove('on'); drawMixer(); };
$('#vAll').onclick = () => { view = 'all'; $('#vAll').classList.add('on'); $('#vScene').classList.remove('on'); drawMixer(); };

function pill() {
  const p = $('#pill'); p.className = 'pill' + (st.connected ? ' ok' : st.reconnecting ? ' reconnect' : '');
  p.innerHTML = '<span class="dot"></span>' + (st.connected ? '' : st.reconnecting ? 'Reconnecting…' : 'OBS offline');
  p.title = st.connected ? 'Connected to OBS' : st.reconnecting ? 'The OBSplit helper is restarting. This fixes itself.' : (st.error || '');
}

liveSocket('/obs-events?view=audio', ev => {
    if (ev.type === 'state') { st = ev; pill(); drawMixer(); }
    else if (ev.type === 'meters') meters(ev.m);
    else if (ev.type === 'mix') { mix = ev; if (tab === 'mix') drawMix(); }
    else if (ev.type === 'note') toast(ev.text);
}, () => { st = { ...st, connected: false, reconnecting: true }; pill(); drawMixer(); });
</script>
</body>
