<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Info</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  body { overflow: auto; }
  #main { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  label { font-size: .82em; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 2px; }
  input[type=text], textarea, select { width: 100%; }
  textarea { resize: vertical; min-height: 90px; }
  /* never taller than about a third of the panel, so title and description stay in view in short docks */
  #thumbBox { position: relative; border: 2px dashed var(--border); border-radius: 8px; aspect-ratio: 16/9;
    width: min(100%, calc(32vh * 16 / 9)); align-self: center; box-sizing: border-box;
    overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; background: var(--panel); }
  #thumbBox.drag { border-color: var(--accent); }
  #thumbBox img { width: 100%; height: 100%; object-fit: cover; }
  #thumbBox .hint { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.65); padding: 5px;
    text-align: center; font-size: .82em; opacity: 0; transition: opacity .15s; }
  #thumbBox:hover .hint, #thumbBox.empty .hint, #thumbBox.busy .hint { opacity: 1; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #saveBar { position: sticky; bottom: 0; background: var(--bg); padding: 8px 0 4px; display: flex; gap: 8px; align-items: center; }
  .over { color: var(--danger); }
  .sec { font-size: .75em; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 6px; }
  label.opt { display: flex; justify-content: flex-start; align-items: center; gap: 6px; font-size: .88em;
    color: var(--text); margin: 2px 0; }
  label.opt select { width: auto; }
  .opt input[type=datetime-local] { flex: 1; }
  .keybox { border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: .86em; }
  .keybox .row-flex select { flex: 1; }
  .ok { color: var(--ok); } .warn { color: var(--warn); }
  .catwrap { position: relative; }
  .catlist { position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; max-height: 260px; overflow: auto; }
  .catlist div { display: flex; gap: 8px; align-items: center; padding: 4px 6px; cursor: pointer; }
  .catlist div:hover { background: rgba(255,255,255,.07); }
  .catlist img { width: 26px; height: 36px; border-radius: 3px; object-fit: cover; }
  .grow-hide { display: none !important; }
  #tabs { display: flex; gap: 4px; padding: 6px 10px 0; }
  #tabs button { display: inline-flex; align-items: center; gap: 5px; }
  #tabs button.on { border-color: var(--accent); }
</style>
</head>
<body>
<div class="bar">
  <select id="pick" class="grow"></select>
  <button id="newBtn" title="Set up a new stream">+ New</button>
  <button id="reload" class="ib" title="Reload from YouTube"></button>
</div>
<div id="tabs" hidden></div>
<div id="main"><div class="notice">Loading…</div></div>
<input id="file" type="file" accept=".jpg,.jpeg,.png" hidden>
<script src="/static/common.js"></script>
<script>
let cats = [], cur = null, orig = null, connected = false;

function form() {
  const m = $('#main'); m.innerHTML = '';
  m.innerHTML = `
    <div id="thumbBox" title="Click or drop an image to change the thumbnail"><img id="thumb" alt=""><div class="hint">Click or drop a JPG/PNG (under 2 MB) to change</div></div>
    <div><label>Title <span id="tc"></span></label><input id="title" type="text" maxlength="100"></div>
    <div><label>Description <span id="dc"></span></label><textarea id="desc" maxlength="5000" rows="6"></textarea></div>
    <div class="two">
      <div><label>Category</label><select id="cat"></select></div>
      <div><label>Visibility</label><select id="priv"><option value="public">Public</option><option value="unlisted">Unlisted</option><option value="private">Private</option></select></div>
    </div>
    <div><label>Tags (comma separated)</label><input id="tags" type="text"></div>
    <div id="saveBar"><button id="save" class="primary" disabled>Save changes</button><button id="undo" disabled>Undo</button>
      <span id="saved" class="muted small"></span></div>`;
  $('#cat').innerHTML = cats.map(c => `<option value="${c.id}">${c.title.replace(/</g, '')}</option>`).join('');
  for (const id of ['title', 'desc', 'cat', 'priv', 'tags']) $('#' + id).addEventListener('input', dirty);
  $('#save').onclick = save; $('#undo').onclick = () => { fill(orig); dirty(); };
  const box = $('#thumbBox');
  box.onclick = () => $('#file').click();
  box.ondragover = e => { e.preventDefault(); box.classList.add('drag'); };
  box.ondragleave = () => box.classList.remove('drag');
  box.ondrop = e => { e.preventDefault(); box.classList.remove('drag'); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
}
$('#file').onchange = () => { if ($('#file').files[0]) upload($('#file').files[0]); $('#file').value = ''; };

function fill(v) {
  $('#title').value = v.title; $('#desc').value = v.description; $('#cat').value = v.categoryId;
  $('#priv').value = v.privacy; $('#tags').value = (v.tags || []).join(', ');
  const img = $('#thumb');
  img.onerror = () => { img.style.visibility = 'hidden'; };
  img.onload = () => { img.style.visibility = 'visible'; };
  img.style.visibility = v.thumb ? 'visible' : 'hidden'; $('#thumbBox').classList.toggle('empty', !v.thumb);
  if (v.thumb) img.src = v.thumb + (v.thumb.includes('?') ? '&' : '?') + 't=' + Date.now(); else img.removeAttribute('src');
}
function values() {
  return { id: cur, title: $('#title').value.trim(), description: $('#desc').value, categoryId: $('#cat').value,
    privacy: $('#priv').value, tags: $('#tags').value.split(',').map(s => s.trim()).filter(Boolean) };
}
function dirty() {
  const v = values();
  const changed = orig && (v.title !== orig.title || v.description !== orig.description || v.categoryId !== orig.categoryId ||
    v.privacy !== orig.privacy || v.tags.join(',') !== (orig.tags || []).join(','));
  $('#save').disabled = $('#undo').disabled = !changed;
  $('#tc').textContent = v.title.length + '/100'; $('#tc').className = v.title.length > 100 ? 'over' : '';
  $('#dc').textContent = $('#desc').value.length + '/5000';
}

async function loadList(keep) {
  if (!connected) {
    $('#main').innerHTML = '<div class="notice"><b>Connect your YouTube account</b> on the <b>OBSplit Setup</b> panel to set up new streams and edit the title, description and thumbnail here.</div>';
    $('#pick').innerHTML = ''; return;
  }
  let d;
  try { d = await api('/api/broadcasts'); } catch (e) { $('#main').innerHTML = '<div class="notice"></div>'; $('.notice').textContent = e.message; return; }
  cats = d.categories;
  const pick = $('#pick'); pick.innerHTML = '';
  for (const b of d.broadcasts) {
    const o = el('option', null, (b.state === 'live' ? 'LIVE: ' : '' + (b.scheduled ? new Date(b.scheduled).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + ': ' : 'Upcoming: ')) + b.title);
    o.value = b.id; pick.appendChild(o);
  }
  if (!d.broadcasts.length) {
    $('#main').innerHTML = '<div class="notice"><b>No live or scheduled stream yet.</b><br><br>Set one up with <b>+ New</b> above. Then press Start Streaming in OBS.</div>';
    return;
  }
  const want = keep && d.broadcasts.some(b => b.id === keep) ? keep : (d.broadcasts.find(b => b.id === d.current) || d.broadcasts.find(b => b.state === 'live') || d.broadcasts[0]).id;
  pick.value = want; await loadVideo(want);
}

async function loadVideo(id) {
  cur = id; form();
  try { orig = await api('/api/video?id=' + encodeURIComponent(id)); fill(orig); dirty(); }
  catch (e) { toast(e.message, true); }
}
$('#pick').onchange = () => loadVideo($('#pick').value);
$('#reload').appendChild(ico('refresh'));
$('#reload').onclick = () => loadList(cur);
$('#newBtn').onclick = () => newForm();

// ---------------- new stream (+ connect OBS to the stream key)
async function keyBox(box, keys) {
  box.innerHTML = '';
  box.appendChild(el('div', 'sec', 'Stream key (what OBS sends to)'));
  const inObs = keys.streams.find(k => k.in_obs);
  const line = el('div', inObs ? 'ok' : 'warn', inObs ? 'OBS is set to "' + inObs.title + '".' : 'OBS isn\'t using one of your YouTube stream keys yet.');
  line.style.margin = '4px 0'; box.appendChild(line);
  if (keys.obs_account_connected) box.appendChild(el('div', 'muted small', 'OBS also has your YouTube account connected (Settings → Stream). Disconnect it there so Start Streaming goes straight live instead of opening "Manage Broadcast".'));
  const row = el('div', 'row-flex');
  const sel = el('select'); sel.id = 'streamKey';
  // XSplit and Restream make a new key for every stream ("XSplitBroadcaster 720p <id>", "restream_<date>"), so
  // channels coming from them have dozens. Keep those out of the way: the key OBS uses (and the last one picked)
  // always show; the rest sit behind one "show older keys" entry, grouped by the program that made them.
  const reusable = keys.streams.filter(k => k.reusable);
  const res = k => k.resolution && k.resolution !== 'variable' ? ', ' + k.resolution : '';
  const maker = k => /^XSplitBroadcaster\b/i.test(k.title || '') ? 'XSplit' : /^restream_/i.test(k.title || '') ? 'Restream' : null;
  const label = k => {
    const t = k.title || '';
    if (maker(k) === 'XSplit') {
      const m = t.match(/^XSplitBroadcaster\s+(\S+)?\s*(\S+)?/i) || [];
      return 'Made by XSplit' + (m[1] ? ', ' + m[1] : '') + (m[2] ? ' · ' + m[2].slice(0, 5) : '');
    }
    if (maker(k) === 'Restream') {
      const d = new Date(t.slice(9));
      return 'Made by Restream, ' + (isNaN(d) ? t.slice(9) : d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })) + res(k);
    }
    if (t === 'Default stream key') return 'YouTube default key' + res(k);
    return t + (res(k) ? ' (' + res(k).slice(2) + ')' : '');
  };
  const keep = id => id && ((inObs && inObs.id === id) || keys.defaults.streamId === id);
  const main = reusable.filter(k => !maker(k) || keep(k.id)), old = reusable.filter(k => maker(k) && !keep(k.id));
  const add = (parent, k) => { const o = el('option', null, label(k)); o.value = k.id; parent.appendChild(o); };
  main.forEach(k => add(sel, k));
  const mk = el('option', null, 'Create a new stream key'); mk.value = ''; sel.appendChild(mk);
  if (old.length) {
    const makers = [...new Set(old.map(maker))];
    if (keyBox.showOld) {
      for (const who of makers) {
        const list = old.filter(k => maker(k) === who);
        const g = document.createElement('optgroup'); g.label = 'Older keys made by ' + who + ' (' + list.length + ')';
        list.forEach(k => add(g, k)); sel.appendChild(g);
      }
    } else {
      const more = el('option', null, 'Show ' + old.length + ' older key' + (old.length === 1 ? '' : 's') + ' made by ' + makers.join(' and ') + '…');
      more.value = '__old'; sel.appendChild(more);
    }
  }
  const pick = (inObs && inObs.id) || (keys.defaults.streamId && reusable.some(k => k.id === keys.defaults.streamId) && keys.defaults.streamId);
  sel.value = pick || (main[0] ? main[0].id : '');
  let last = sel.value;
  sel.onchange = () => {
    if (sel.value !== '__old') { last = sel.value; return; }
    keyBox.showOld = true; keyBox(box, keys).then(() => { const s = $('#streamKey'); if (s) s.value = last; });
  };
  const use = el('button', null, 'Use in OBS');
  use.title = 'Puts this stream key into OBS (Settings → Stream). The key goes from YouTube straight into OBS.';
  use.onclick = async () => {
    use.disabled = true;
    try { const r = await api('/api/yt/use-key', { streamId: sel.value }); toast('OBS now streams to this key'); keyBox(box, await api('/api/yt/streams')); }
    catch (e) { toast(e.message, true); use.disabled = false; }
  };
  row.append(sel, use); box.appendChild(row);
}

async function newForm() {
  if (!connected) return toast('Connect your YouTube account on the OBSplit Setup panel first.', true);
  let keys, d;
  try { [keys, d] = await Promise.all([api('/api/yt/streams'), api('/api/broadcasts')]); } catch (e) { return toast(e.message, true); }
  cats = d.categories;
  const p = keys.defaults || {};
  const m = $('#main'); m.innerHTML = `
    <div class="sec" style="margin-top:0">New stream</div>
    <div><label>Title <span id="tc"></span></label><input id="nTitle" type="text" maxlength="100"></div>
    <div><label>Description</label><textarea id="nDesc" maxlength="5000" rows="5"></textarea></div>
    <div class="two">
      <div><label>Category</label><select id="nCat"></select></div>
      <div><label>Visibility</label><select id="nPriv"><option value="public">Public</option><option value="unlisted">Unlisted</option><option value="private">Private</option></select></div>
    </div>
    <div><label>Tags (comma separated)</label><input id="nTags" type="text"></div>
    <div class="sec">When</div>
    <label class="opt"><input type="radio" name="when" value="now" checked> As soon as I press Start Streaming</label>
    <label class="opt"><input type="radio" name="when" value="later"> Schedule for <input id="nWhen" type="datetime-local"></label>
    <div class="sec">Options</div>
    <label class="opt"><input id="nKids" type="checkbox"> Made for kids</label>
    <label class="opt"><input id="nAutoStart" type="checkbox" checked> Go live automatically when OBS starts sending</label>
    <label class="opt"><input id="nAutoStop" type="checkbox" checked> End the stream automatically when OBS stops</label>
    <label class="opt"><input id="nDvr" type="checkbox" checked> Let viewers rewind (DVR)</label>
    <label class="opt">Latency <select id="nLat" style="width:auto" title="How far behind your viewers are. Can't be changed once you're live."><option value="low">Low: about 5–10 s behind (recommended)</option><option value="ultraLow">Ultra-low: about 2–5 s, no 1440p/4K or captions</option><option value="normal">Normal: 15–60 s behind, smoothest on slow connections</option></select></label>
    <div class="keybox" id="keyBox"></div>
    <div id="saveBar"><button id="create" class="primary">Create stream</button><button id="cancel">Cancel</button><span class="muted small">Uses about 150 API units. Add a thumbnail right after.</span></div>`;
  $('#nCat').innerHTML = cats.map(c => `<option value="${c.id}">${c.title.replace(/</g, '')}</option>`).join('');
  $('#nTitle').value = p.title || ''; $('#nDesc').value = p.description || ''; $('#nCat').value = p.categoryId || '20';
  $('#nPriv').value = p.privacy || 'public'; $('#nTags').value = (p.tags || []).join(', ');
  $('#nKids').checked = !!p.madeForKids; $('#nAutoStart').checked = p.autoStart !== false; $('#nAutoStop').checked = p.autoStop !== false;
  // latency is only remembered once you've picked one yourself (older versions defaulted to Normal)
  $('#nDvr').checked = p.dvr !== false; $('#nLat').value = (p.latencyPicked && p.latency) || 'low';
  let latPicked = !!p.latencyPicked; $('#nLat').onchange = () => { latPicked = true; };
  const t = new Date(Date.now() + 3600e3); t.setMinutes(0, 0, 0);
  $('#nWhen').value = new Date(t - t.getTimezoneOffset() * 60e3).toISOString().slice(0, 16);
  $('#nWhen').onfocus = () => { document.querySelector('input[name=when][value=later]').checked = true; };
  const tc = () => { $('#tc').textContent = $('#nTitle').value.length + '/100'; }; $('#nTitle').oninput = tc; tc();
  await keyBox($('#keyBox'), keys);
  $('#cancel').onclick = () => loadList(cur);
  $('#create').onclick = async () => {
    const later = document.querySelector('input[name=when]:checked').value === 'later';
    const body = { title: $('#nTitle').value.trim(), description: $('#nDesc').value, categoryId: $('#nCat').value,
      privacy: $('#nPriv').value, tags: $('#nTags').value.split(',').map(x => x.trim()).filter(Boolean),
      when: later ? $('#nWhen').value : '', madeForKids: $('#nKids').checked, autoStart: $('#nAutoStart').checked,
      autoStop: $('#nAutoStop').checked, dvr: $('#nDvr').checked, latency: $('#nLat').value, latencyPicked: latPicked,
      streamId: ($('#streamKey') || {}).value || '' };
    if (!body.title) return toast('Give the stream a title.', true);
    $('#create').disabled = true;
    try {
      const v = await api('/api/yt/new', body);
      toast(later ? 'Stream scheduled. Add a thumbnail now if you like.' : 'Stream ready. Press Start Streaming in OBS to go live.');
      await loadList(v.id);
    } catch (e) { toast(e.message, true); $('#create').disabled = false; }
  };
}

async function save() {
  const v = values();
  if (!v.title) return toast('The title can\'t be empty.', true);
  $('#save').disabled = true; $('#saved').textContent = 'Saving…';
  try { orig = await api('/api/video', v); fill(orig); dirty(); $('#saved').textContent = 'Saved at ' + fmtTime(Date.now()); toast('Saved to YouTube'); }
  catch (e) { $('#saved').textContent = ''; toast(e.message, true); dirty(); }
}

async function upload(file) {
  if (!/^image\/(jpeg|png)$/.test(file.type)) return toast('Use a JPG or PNG image.', true);
  if (file.size > 2 * 1024 * 1024) return toast('That image is over 2 MB. Save it smaller (1280×720 JPG works best).', true);
  if (!confirm('Upload "' + file.name + '" as the thumbnail?')) return;
  $('.hint').textContent = 'Uploading…'; $('#thumbBox').classList.add('busy');
  try {
    await api('/api/thumbnail?id=' + encodeURIComponent(cur), await file.arrayBuffer(), { raw: true, type: file.type });
    $('#thumb').src = URL.createObjectURL(file); toast('Thumbnail updated');
  } catch (e) { toast(e.message, true); }
  $('.hint').textContent = 'Click or drop a JPG/PNG (under 2 MB) to change'; $('#thumbBox').classList.remove('busy');
}

let lastVideo;
// ---------------- Twitch: title, category, tags, stream key (Twitch has no thumbnails or scheduled streams)
let twitchMode = false, tw = null, bothMode = false, twConn = false, tab = 'youtube';
async function loadTwitch() {
  const m = $('#main');
  if (!(bothMode ? twConn : connected)) {
    m.innerHTML = '<div class="notice"><b>Connect Twitch</b> on the <b>OBSplit Setup</b> panel to change your title, category and tags here.</div>';
    return;
  }
  try { tw = await api('/api/tw/channel'); } catch (e) { m.innerHTML = '<div class="notice"></div>'; $('.notice').textContent = e.message; return; }
  m.innerHTML = `
    <div><label>Title <span id="tc"></span></label><input id="title" type="text" maxlength="140"></div>
    <div class="catwrap"><label>Category</label><input id="catq" type="text" placeholder="Search for a game or category" autocomplete="off"><div id="catlist" class="catlist" hidden></div></div>
    <div><label>Tags (comma separated, up to 10, letters and numbers only)</label><input id="tags" type="text"></div>
    <div id="saveBar"><button id="save" class="primary" disabled>Save changes</button><button id="undo" disabled>Undo</button>
      <span id="saved" class="muted small"></span></div>
    <div class="keybox" id="twKey"></div>`;
  let catId = tw.game_id, catName = tw.game_name;
  const fillTw = () => { $('#title').value = tw.title; $('#catq').value = tw.game_name; $('#tags').value = (tw.tags || []).join(', '); catId = tw.game_id; catName = tw.game_name; };
  const vals = () => ({ title: $('#title').value.trim(), game_id: catId, tags: $('#tags').value.split(',').map(s => s.trim()).filter(Boolean) });
  const twDirty = () => {
    const v = vals();
    const changed = v.title !== tw.title || v.game_id !== tw.game_id || v.tags.join(',') !== (tw.tags || []).join(',');
    $('#save').disabled = $('#undo').disabled = !changed;
    $('#tc').textContent = v.title.length + '/140';
  };
  fillTw(); twDirty();
  for (const id of ['title', 'tags']) $('#' + id).addEventListener('input', twDirty);
  let t = null;
  $('#catq').addEventListener('input', () => {
    clearTimeout(t);
    const q = $('#catq').value.trim();
    if (!q) { $('#catlist').hidden = true; return; }
    t = setTimeout(async () => {
      let d; try { d = await api('/api/tw/categories?q=' + encodeURIComponent(q)); } catch (e) { return; }
      const l = $('#catlist'); l.innerHTML = '';
      for (const c of d.categories) {
        const row = el('div'); if (c.art) { const i = el('img'); i.src = c.art; row.appendChild(i); }
        row.appendChild(el('span', null, c.name));
        row.onclick = () => { catId = c.id; catName = c.name; $('#catq').value = c.name; l.hidden = true; twDirty(); };
        l.appendChild(row);
      }
      l.hidden = !d.categories.length;
    }, 300);
  });
  $('#catq').addEventListener('blur', () => setTimeout(() => { $('#catlist').hidden = true; $('#catq').value = catName; }, 200));
  $('#undo').onclick = () => { fillTw(); twDirty(); };
  $('#save').onclick = async () => {
    $('#save').disabled = true;
    try { tw = { ...tw, ...(await api('/api/tw/channel', vals())) }; fillTw(); twDirty(); toast('Saved to Twitch'); $('#saved').textContent = 'Saved ' + fmtTime(Date.now()); }
    catch (e) { toast(e.message, true); twDirty(); }
  };
  // The Twitch button already points OBS at Twitch; only offer a fix when OBS ended up somewhere else
  // (Twitch connected after switching, or OBS's stream settings changed by hand).
  const kb = $('#twKey');
  if (bothMode) {          // Twitch runs on OBSplit's second stream; OBS's own stream stays on YouTube
    kb.className = 'muted small'; kb.textContent = 'Twitch streams alongside YouTube: Start Streaming in OBS starts both.';
  } else if (tw.key_in_obs) {
    kb.className = 'muted small'; kb.textContent = 'Start Streaming in OBS goes to Twitch.';
  } else {
    kb.appendChild(el('div', 'warn', 'OBS isn\'t set to stream to Twitch.'));
    const use = el('button', null, 'Use my Twitch key in OBS');
    use.title = 'Puts your Twitch stream key into OBS (Settings → Stream). The key goes from Twitch straight into OBS.';
    use.onclick = async () => { use.disabled = true; try { await api('/api/tw/use-key', {}); toast('OBS now streams to Twitch'); loadTwitch(); } catch (e) { toast(e.message, true); use.disabled = false; } };
    use.style.marginTop = '6px'; kb.appendChild(use);
  }
}

function setMode(platform) {
  bothMode = platform === 'both';
  twitchMode = platform === 'twitch' || (bothMode && tab === 'twitch');
  // YouTube + Twitch: one tab per platform
  const tb = $('#tabs'); tb.hidden = !bothMode; tb.innerHTML = '';
  if (bothMode) for (const [k, mk, label] of [['youtube', 'yt', 'YouTube'], ['twitch', 'tw', 'Twitch']]) {
    const b = el('button', tab === k ? 'on' : ''); b.append(platformMark(mk), document.createTextNode(label));
    b.onclick = () => { if (tab === k) return; tab = k; setMode('both'); twitchMode ? loadTwitch() : loadList(); };
    tb.appendChild(b);
  }
  $('#pick').classList.toggle('grow-hide', twitchMode); $('#newBtn').classList.toggle('grow-hide', twitchMode);
  $('#reload').title = twitchMode ? 'Reload from Twitch' : 'Reload from YouTube';
  $('#reload').onclick = () => twitchMode ? loadTwitch() : loadList(cur);
}

connect(ev => {
  if (ev.type === 'hello' || ev.type === 'settings') {
    const was = connected; connected = ev.connected; twConn = !!ev.tw_connected;
    if (ev.platform) setMode(ev.platform);
    if (twitchMode) { if (ev.type === 'hello' || was !== connected) loadTwitch(); return; }
    if (ev.type === 'hello' || was !== connected) { lastVideo = ev.status && ev.status.video; loadList(); }
  } else if (ev.type === 'status') {
    connected = ev.connected;
    if (twitchMode) return;
    if (ev.video !== lastVideo) { lastVideo = ev.video; if ($('#save') && !$('#save').disabled) return; loadList(ev.video); }
  }
});
</script>
</body>
