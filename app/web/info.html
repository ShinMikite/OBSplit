<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Stream Info</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  body { overflow: auto; }
  #main { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  label { font-size: .82em; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 2px; }
  input[type=text], textarea, select { width: 100%; }
  textarea { resize: vertical; min-height: 90px; }
  #thumbBox { position: relative; border: 2px dashed var(--border); border-radius: 8px; aspect-ratio: 16/9;
    overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; background: var(--panel); }
  #thumbBox.drag { border-color: var(--accent); }
  #thumbBox img { width: 100%; height: 100%; object-fit: cover; }
  #thumbBox .hint { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.65); padding: 5px;
    text-align: center; font-size: .82em; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #saveBar { position: sticky; bottom: 0; background: var(--bg); padding: 8px 0 4px; display: flex; gap: 8px; align-items: center; }
  .over { color: var(--danger); }
</style>
</head>
<body>
<div class="bar">
  <span id="pill" class="pill"><span class="dot"></span>…</span>
  <select id="pick" class="grow"></select>
  <button id="reload" title="Reload from YouTube">⟳</button>
</div>
<div id="main"><div class="notice">Loading…</div></div>
<input id="file" type="file" accept="image/jpeg,image/png" hidden>
<script src="/static/common.js"></script>
<script>
let cats = [], cur = null, orig = null, connected = false;

function form() {
  const m = $('#main'); m.innerHTML = '';
  m.innerHTML = `
    <div id="thumbBox" title="Click or drop an image to change the thumbnail"><img id="thumb" alt=""><div class="hint">Click or drop a JPG/PNG (under 2 MB, 1280×720) to change thumbnail</div></div>
    <div><label>Title <span id="tc"></span></label><input id="title" type="text" maxlength="100"></div>
    <div><label>Description <span id="dc"></span></label><textarea id="desc" maxlength="5000" rows="6"></textarea></div>
    <div class="two">
      <div><label>Category</label><select id="cat"></select></div>
      <div><label>Visibility</label><select id="priv"><option value="public">Public</option><option value="unlisted">Unlisted</option><option value="private">Private</option></select></div>
    </div>
    <div><label>Tags (comma separated)</label><input id="tags" type="text"></div>
    <div id="saveBar"><button id="save" class="primary" disabled>Save changes</button><button id="undo" disabled>Undo</button>
      <span id="saved" class="muted small"></span></div>
    <div class="muted small">Saving uses 51 and a thumbnail upload 50 of your 10,000 daily YouTube API units.</div>`;
  $('#cat').innerHTML = cats.map(c => `<option value="${c.id}">${c.title.replace(/</g, '')}</option>`).join('');
  for (const id of ['title', 'desc', 'cat', 'priv', 'tags']) $('#' + id).addEventListener('input', dirty);
  $('#save').onclick = save; $('#undo').onclick = () => { fill(orig); dirty(); };
  const box = $('#thumbBox');
  box.onclick = () => $('#file').click();
  box.ondragover = e => { e.preventDefault(); box.classList.add('drag'); };
  box.ondragleave = () => box.classList.remove('drag');
  box.ondrop = e => { e.preventDefault(); box.classList.remove('drag'); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
}
$('#file').onchange = () => { if ($('#file').files[0]) upload($('#file').files[0]); $('#file').value = ''; };

function fill(v) {
  $('#title').value = v.title; $('#desc').value = v.description; $('#cat').value = v.categoryId;
  $('#priv').value = v.privacy; $('#tags').value = (v.tags || []).join(', ');
  const img = $('#thumb');
  img.onerror = () => { img.style.visibility = 'hidden'; };
  img.onload = () => { img.style.visibility = 'visible'; };
  img.style.visibility = v.thumb ? 'visible' : 'hidden';
  if (v.thumb) img.src = v.thumb + (v.thumb.includes('?') ? '&' : '?') + 't=' + Date.now(); else img.removeAttribute('src');
}
function values() {
  return { id: cur, title: $('#title').value.trim(), description: $('#desc').value, categoryId: $('#cat').value,
    privacy: $('#priv').value, tags: $('#tags').value.split(',').map(s => s.trim()).filter(Boolean) };
}
function dirty() {
  const v = values();
  const changed = orig && (v.title !== orig.title || v.description !== orig.description || v.categoryId !== orig.categoryId ||
    v.privacy !== orig.privacy || v.tags.join(',') !== (orig.tags || []).join(','));
  $('#save').disabled = $('#undo').disabled = !changed;
  $('#tc').textContent = v.title.length + '/100'; $('#tc').className = v.title.length > 100 ? 'over' : '';
  $('#dc').textContent = $('#desc').value.length + '/5000';
}

async function loadList(keep) {
  if (!connected) {
    $('#main').innerHTML = '<div class="notice"><b>Connect your YouTube account</b> on the <b>YT Setup</b> panel to edit your stream title, description and thumbnail here.</div>';
    $('#pick').innerHTML = ''; return;
  }
  let d;
  try { d = await api('/api/broadcasts'); } catch (e) { $('#main').innerHTML = '<div class="notice"></div>'; $('.notice').textContent = e.message; return; }
  cats = d.categories;
  const pick = $('#pick'); pick.innerHTML = '';
  for (const b of d.broadcasts) {
    const o = el('option', null, (b.state === 'live' ? '🔴 LIVE: ' : '🕒 ' + (b.scheduled ? new Date(b.scheduled).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + ': ' : 'Upcoming: ')) + b.title);
    o.value = b.id; pick.appendChild(o);
  }
  if (!d.broadcasts.length) {
    $('#main').innerHTML = '<div class="notice"><b>No live or scheduled stream yet.</b><br><br>Click <b>Manage Broadcast</b> in OBS (or just start streaming). It will show up here and you can edit it at any time, including while live.</div>';
    return;
  }
  const want = keep && d.broadcasts.some(b => b.id === keep) ? keep : (d.broadcasts.find(b => b.id === d.current) || d.broadcasts.find(b => b.state === 'live') || d.broadcasts[0]).id;
  pick.value = want; await loadVideo(want);
}

async function loadVideo(id) {
  cur = id; form();
  try { orig = await api('/api/video?id=' + encodeURIComponent(id)); fill(orig); dirty(); }
  catch (e) { toast(e.message, true); }
}
$('#pick').onchange = () => loadVideo($('#pick').value);
$('#reload').onclick = () => loadList(cur);

async function save() {
  const v = values();
  if (!v.title) return toast('The title can\'t be empty.', true);
  $('#save').disabled = true; $('#saved').textContent = 'Saving…';
  try { orig = await api('/api/video', v); fill(orig); dirty(); $('#saved').textContent = 'Saved ✓ ' + fmtTime(Date.now()); toast('Saved to YouTube'); }
  catch (e) { $('#saved').textContent = ''; toast(e.message, true); dirty(); }
}

async function upload(file) {
  if (!/^image\/(jpeg|png)$/.test(file.type)) return toast('Use a JPG or PNG image.', true);
  if (file.size > 2 * 1024 * 1024) return toast('That image is over 2 MB. Save it smaller (1280×720 JPG works best).', true);
  if (!confirm('Upload "' + file.name + '" as the thumbnail?')) return;
  $('.hint').textContent = 'Uploading…';
  try {
    await api('/api/thumbnail?id=' + encodeURIComponent(cur), await file.arrayBuffer(), { raw: true, type: file.type });
    $('#thumb').src = URL.createObjectURL(file); toast('Thumbnail updated');
  } catch (e) { toast(e.message, true); }
  $('.hint').textContent = 'Click or drop a JPG/PNG (under 2 MB, 1280×720) to change thumbnail';
}

let lastVideo;
connect(ev => {
  if (ev.type === 'hello' || ev.type === 'settings') {
    const was = connected; connected = ev.connected;
    if (ev.status) statusPill($('#pill'), ev.status);
    if (ev.type === 'hello' || was !== connected) { lastVideo = ev.status && ev.status.video; loadList(); }
  } else if (ev.type === 'status') {
    statusPill($('#pill'), ev); connected = ev.connected;
    if (ev.video !== lastVideo) { lastVideo = ev.video; if ($('#save') && !$('#save').disabled) return; loadList(ev.video); }
  } else if (ev.type === 'disconnected') statusPill($('#pill'), { state: 'disconnected' });
});
</script>
</body>
</html>
