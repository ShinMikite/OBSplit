<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Chat</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  #list { flex: 1; overflow-y: auto; padding: 4px 0 6px; }
  .msg { position: relative; padding: 3px 8px 3px 8px; word-wrap: break-word; border-left: 3px solid transparent; }
  .msg:hover { background: rgba(255,255,255,.035); }
  .msg.hl { background: var(--hl); border-left-color: var(--accent); }
  .msg.first { border-left-color: var(--ok); }
  .msg.del .text { text-decoration: line-through; opacity: .45; }
  .msg.del .text::after { content: " (deleted)"; font-size: .8em; text-decoration: none; display: inline-block; }
  .msg.hidden { display: none; }
  .ts { color: var(--muted); font-size: .78em; margin-right: 5px; font-variant-numeric: tabular-nums; }
  body.no-ts .ts { display: none; }
  .av { width: 1.4em; height: 1.4em; border-radius: 50%; vertical-align: -.35em; margin-right: 4px; }
  body:not(.avatars) .av { display: none; }
  .bdg { display: inline-flex; align-items: center; justify-content: center; width: 1.15em; height: 1.15em;
    border-radius: 3px; margin-right: 3px; vertical-align: -.2em; }
  .bdg svg { width: .85em; height: .85em; fill: #fff; }
  .bdg.owner { background: #c89400; } .bdg.mod { background: #2f6ee8; } .bdg.verified { background: #666a78; }
  .bdg.member { width: auto; height: 1.15em; } .bdg.member img { height: 1.15em; }
  .tag { font-size: .68em; font-weight: 700; padding: 0 4px; border-radius: 3px; margin-right: 4px;
    vertical-align: .12em; background: var(--ok); color: #08130b; }
  .name { font-weight: 600; cursor: pointer; }
  .name:hover { text-decoration: underline; }
  .emo { height: 1.5em; vertical-align: -.4em; margin: 0 1px; }
  .text a { cursor: pointer; }
  .tools { position: absolute; right: 6px; top: 1px; display: none; gap: 3px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 6px; padding: 1px 3px; }
  body.can-mod .msg:hover .tools { display: flex; }
  .tools button { border: 0; background: none; padding: 1px 5px; font-size: .85em; }
  .tools button:hover { background: rgba(255,255,255,.08); }
  .card { margin: 4px 8px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
  .card .head { padding: 6px 10px; display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .card .head .amt { margin-left: auto; font-weight: 700; }
  .card .body { padding: 5px 10px 7px; }
  .card.member .head, .card.milestone .head { background: #0f5a2c; }
  .card.milestone .body { background: #13451f; }
  .card.gift .head { background: #3f2a78; }
  .card .body:empty { display: none; }
  .card .sticker { height: 72px; }
  .card .tools { top: 6px; }
  .sys { color: var(--muted); font-style: italic; font-size: .9em; padding: 3px 10px; }
  .giftrecv { color: #c7b4ff; font-size: .9em; }
  #more { position: absolute; left: 50%; transform: translateX(-50%); bottom: 58px; z-index: 5;
    background: var(--accent); border: 0; color: #fff; border-radius: 99px; padding: 4px 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #bottom { flex: none; display: flex; gap: 6px; padding: 7px 8px; background: var(--panel);
    border-top: 1px solid var(--border); }
  #msgIn { flex: 1; min-width: 0; }
  #count { align-self: center; font-size: .75em; }
  .uc-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .uc-head img { width: 48px; height: 48px; border-radius: 50%; }
  .uc-name { font-size: 1.15em; font-weight: 700; }
  .uc-sec { margin: 10px 0 4px; font-size: .78em; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .uc-hist { max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
  .uc-hist div { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
  .lbl { display: block; margin: 8px 0 3px; font-size: .85em; color: var(--muted); }
</style>
</head>
<body>
<div class="bar">
  <span id="pill" class="pill"><span class="dot"></span>…</span>
  <span id="viewers" class="muted small"></span>
  <input id="filter" class="grow" placeholder="Filter chat…">
  <button id="gear" title="Chat settings">⚙</button>
</div>
<div id="list"></div>
<button id="more" hidden></button>
<div id="bottom">
  <input id="msgIn" maxlength="200" placeholder="Send a message…" autocomplete="off">
  <span id="count" class="muted"></span>
  <button id="send" class="primary">Chat</button>
</div>
<script src="/static/common.js"></script>
<script>
const SVG = {
  owner: '<svg viewBox="0 0 24 24"><path d="M2 19h20v2H2zM2 6l5 4 5-7 5 7 5-4-2 11H4z"/></svg>',
  mod: '<svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>',
  verified: '<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
};
const COLORS = ['#ff6b6b','#ff9f43','#feca57','#1dd1a1','#48dbfb','#54a0ff','#a29bfe','#fd79a8',
  '#e17055','#00cec9','#81ecec','#fab1a0','#55efc4','#74b9ff','#ffeaa7','#b8e994','#f8a5c2','#7bed9f'];
const MAX_ROWS = 800;
let cfg = {}, status = {}, connected = false, pinned = true, unread = 0;
const chatters = new Map(); // name -> {ch, last}
const sent = []; let sentIdx = -1;
const list = $('#list'), filterIn = $('#filter'), msgIn = $('#msgIn');

function colorFor(ch) { let h = 0; for (const c of ch || '') h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }

function applySettings() {
  document.documentElement.style.setProperty('--fs', (cfg.font_size || 14) + 'px');
  document.body.classList.toggle('no-ts', !cfg.show_timestamps);
  document.body.classList.toggle('avatars', !!cfg.show_avatars);
  document.body.classList.toggle('can-mod', connected);
  updateInput();
}

function hlWords() {
  const w = (cfg.highlight_words || []).map(s => s.trim().toLowerCase()).filter(Boolean);
  if (cfg.channel_title) w.push(cfg.channel_title.toLowerCase());
  if (cfg.channel_handle) w.push(cfg.channel_handle.toLowerCase().replace(/^@/, ''));
  return w;
}

function segsNode(segs) {
  const span = el('span', 'text');
  for (const s of segs || []) {
    if (s.e) { const i = el('img', 'emo'); i.src = s.e; i.alt = s.alt || ''; i.title = s.alt || ''; span.appendChild(i); }
    else if (s.u) {
      const a = el('a', null, s.t); a.title = s.u + '\n(click to copy link)';
      a.onclick = e => { e.preventDefault(); navigator.clipboard.writeText(s.u).then(() => toast('Link copied')); };
      span.appendChild(a);
    } else { const t = s.b ? el('b', null, s.t) : document.createTextNode(s.t || ''); span.appendChild(t); }
  }
  return span;
}

function badgesNode(badges) {
  const frag = document.createDocumentFragment();
  for (const b of badges || []) {
    const s = el('span', 'bdg ' + b.k); s.title = b.tip || b.k;
    if (b.k === 'member') { if (b.img) { const i = el('img'); i.src = b.img; s.appendChild(i); } else continue; }
    else s.innerHTML = SVG[b.k] || '';
    frag.appendChild(s);
  }
  return frag;
}

function nameNode(ev) {
  const n = el('span', 'name', ev.name); n.style.color = colorFor(ev.ch);
  n.onclick = () => openUser(ev.ch, ev.name);
  return n;
}

function toolsNode(ev) {
  const t = el('span', 'tools');
  const b = (label, title, fn) => { const x = el('button', null, label); x.title = title; x.onclick = e => { e.stopPropagation(); fn(); }; t.appendChild(x); };
  b('🗑', 'Delete message', () => act('/api/delete', { id: ev.id }, 'Message deleted'));
  b('⏱', 'Time out (' + fmtSecs(cfg.timeout_default || 300) + ')', () =>
    act('/api/ban', { ch: ev.ch, seconds: cfg.timeout_default || 300 }, ev.name + ' timed out for ' + fmtSecs(cfg.timeout_default || 300)));
  b('🚫', 'Ban from chat', () => { if (confirm('Ban ' + ev.name + ' from your chat?')) act('/api/ban', { ch: ev.ch, seconds: 0 }, ev.name + ' banned'); });
  return t;
}

function fmtSecs(s) { return s >= 3600 ? (s / 3600) + 'h' : s >= 60 ? (s / 60) + 'm' : s + 's'; }

function render(ev) {
  let row;
  const isMine = ev.ch && ev.ch === cfg.channel_id;
  if (ev.kind === 'system') {
    row = el('div', 'sys'); row.appendChild(segsNode(ev.segs));
  } else if (ev.kind === 'giftrecv') {
    row = el('div', 'msg giftrecv');
    row.appendChild(el('span', 'ts', fmtTime(ev.ts))); row.appendChild(nameNode(ev));
    row.appendChild(document.createTextNode(' ' + (ev.header || 'received a gift membership')));
  } else if (ev.kind === 'text') {
    row = el('div', 'msg');
    row.appendChild(el('span', 'ts', fmtTime(ev.ts)));
    if (ev.photo) { const a = el('img', 'av'); a.src = ev.photo; row.appendChild(a); }
    if (ev.first) row.appendChild(el('span', 'tag', 'FIRST'));
    row.appendChild(badgesNode(ev.badges)); row.appendChild(nameNode(ev));
    row.appendChild(document.createTextNode(': ')); row.appendChild(segsNode(ev.segs));
    if (ev.first) row.classList.add('first');
    if (!isMine) {
      const txt = (ev.segs || []).map(s => s.t || '').join('').toLowerCase();
      if (hlWords().some(w => txt.includes(w))) row.classList.add('hl');
    }
  } else {
    row = el('div', 'msg card ' + ev.kind);
    const head = el('div', 'head'), body = el('div', 'body');
    if (ev.photo) { const a = el('img', 'av'); a.src = ev.photo; a.style.display = 'inline'; head.appendChild(a); }
    head.appendChild(badgesNode(ev.badges)); head.appendChild(nameNode(ev));
    if (ev.kind === 'superchat' || ev.kind === 'sticker') {
      head.appendChild(el('span', 'amt', ev.amount));
      head.style.background = ev.hcolor || ev.color || '#1e88e5'; body.style.background = ev.color || '#1565c0';
      if (ev.kind === 'sticker' && ev.sticker) { const i = el('img', 'sticker'); i.src = ev.sticker; body.appendChild(i); }
      else body.appendChild(segsNode(ev.segs));
    } else {
      head.appendChild(el('span', 'amt small', ev.header || (ev.kind === 'member' ? 'New member' : '')));
      if (ev.segs && ev.segs.length) body.appendChild(segsNode(ev.segs));
    }
    row.appendChild(head); row.appendChild(body);
  }
  row.dataset.id = ev.id || ''; row.dataset.ch = ev.ch || '';
  row.dataset.search = ((ev.name || '') + ' ' + (ev.segs || []).map(s => s.t || s.alt || '').join('')).toLowerCase();
  if (ev.deleted) row.classList.add('del');
  if (ev.ch && !isMine && ev.kind !== 'system') row.appendChild(toolsNode(ev));
  if (filterIn.value && !row.dataset.search.includes(filterIn.value.toLowerCase())) row.classList.add('hidden');
  if (ev.name && ev.ch) { chatters.delete(ev.name); chatters.set(ev.name, { ch: ev.ch, last: ev.ts }); }
  return row;
}

function add(ev, bulk) {
  const row = render(ev);
  list.appendChild(row);
  while (list.children.length > MAX_ROWS) {
    const first = list.firstElementChild, h = first.offsetHeight;
    first.remove(); if (!pinned) list.scrollTop -= h;
  }
  if (bulk) return;
  if (pinned) list.scrollTop = list.scrollHeight;
  else { unread++; $('#more').textContent = '▼ ' + unread + ' new message' + (unread > 1 ? 's' : ''); $('#more').hidden = false; }
}

list.addEventListener('scroll', () => {
  pinned = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  if (pinned) { unread = 0; $('#more').hidden = true; }
});
$('#more').onclick = () => { list.scrollTop = list.scrollHeight; };

filterIn.addEventListener('input', () => {
  const f = filterIn.value.toLowerCase();
  for (const r of list.children) r.classList.toggle('hidden', !!f && !(r.dataset.search || '').includes(f));
  if (!f) list.scrollTop = list.scrollHeight;
});

async function act(path, body, okMsg) {
  try { await api(path, body); if (okMsg) toast(okMsg); return true; }
  catch (e) { toast(e.message, true); return false; }
}

// ---------- sending
function updateInput() {
  const live = !!status.video;
  msgIn.disabled = $('#send').disabled = !(connected && live);
  msgIn.placeholder = !connected ? 'Connect YouTube on the Setup panel to chat'
    : !live ? 'Not live right now' : 'Send a message…  (Tab = complete @names)';
}
async function send() {
  const t = msgIn.value.trim(); if (!t) return;
  $('#send').disabled = true;
  if (await act('/api/send', { text: t })) { sent.unshift(t); sentIdx = -1; msgIn.value = ''; $('#count').textContent = ''; }
  $('#send').disabled = false; msgIn.focus();
}
$('#send').onclick = send;
let tabState = null;
msgIn.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); send(); return; }
  if (e.key === 'ArrowUp' && sent.length) { e.preventDefault(); sentIdx = Math.min(sent.length - 1, sentIdx + 1); msgIn.value = sent[sentIdx]; return; }
  if (e.key === 'ArrowDown' && sentIdx >= 0) { e.preventDefault(); sentIdx--; msgIn.value = sentIdx >= 0 ? sent[sentIdx] : ''; return; }
  if (e.key === 'Tab') {
    e.preventDefault();
    if (!tabState) {
      const pos = msgIn.selectionStart, before = msgIn.value.slice(0, pos);
      const m = before.match(/@?([^\s@]*)$/); const prefix = m[1].toLowerCase();
      const names = [...chatters.keys()].reverse().filter(n => n.toLowerCase().replace(/^@/, '').startsWith(prefix));
      if (!names.length) return;
      tabState = { start: pos - m[0].length, end: pos, names, i: 0 };
    } else tabState.i = (tabState.i + 1) % tabState.names.length;
    const n = tabState.names[tabState.i], ins = (n.startsWith('@') ? n : '@' + n) + ' ';
    msgIn.value = msgIn.value.slice(0, tabState.start) + ins + msgIn.value.slice(tabState.end);
    tabState.end = tabState.start + ins.length; msgIn.setSelectionRange(tabState.end, tabState.end);
    return;
  }
  tabState = null;
});
msgIn.addEventListener('input', () => { $('#count').textContent = msgIn.value.length > 150 ? (200 - msgIn.value.length) : ''; });

// ---------- user card
async function openUser(ch, name) {
  let d;
  try { d = await api('/api/user?ch=' + encodeURIComponent(ch)); } catch (e) { toast(e.message, true); return; }
  const bg = el('div', 'modal-bg'), m = el('div', 'modal');
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { bg.remove(); document.removeEventListener('keydown', esc); } });
  const head = el('div', 'uc-head');
  if (d.photo) { const i = el('img'); i.src = d.photo.replace(/=s\d+-/, '=s96-'); head.appendChild(i); }
  const info = el('div'); const nm = el('div', 'uc-name'); nm.appendChild(badgesNode(d.badges));
  const nn = el('span', null, d.name || name); nn.style.color = colorFor(ch); nm.appendChild(nn); info.appendChild(nm);
  const seen = d.first_seen ? 'First seen ' + new Date(d.first_seen).toLocaleDateString() : 'New here';
  info.appendChild(el('div', 'muted small', seen + ' · ' + d.msg_count + ' message' + (d.msg_count === 1 ? '' : 's') +
    ' · ' + d.streams + ' stream' + (d.streams === 1 ? '' : 's')));
  head.appendChild(info); m.appendChild(head);

  const r1 = el('div', 'row-flex');
  const btn = (label, fn, cls) => { const b = el('button', cls, label); b.onclick = fn; return b; };
  r1.appendChild(btn('@ Mention', () => { const n = (d.name || name); msgIn.value += (n.startsWith('@') ? n : '@' + n) + ' '; bg.remove(); msgIn.focus(); }));
  r1.appendChild(btn('Copy channel link', () => navigator.clipboard.writeText('https://www.youtube.com/channel/' + ch).then(() => toast('Channel link copied'))));
  m.appendChild(r1);

  if (connected && ch !== cfg.channel_id) {
    m.appendChild(el('div', 'uc-sec', 'Moderate'));
    const r2 = el('div', 'row-flex');
    r2.appendChild(el('span', 'muted small', 'Time out:'));
    for (const s of [10, 60, 300, 600, 3600, 86400])
      r2.appendChild(btn(fmtSecs(s), () => act('/api/ban', { ch, seconds: s }, (d.name || name) + ' timed out for ' + fmtSecs(s)).then(ok => ok && bg.remove())));
    m.appendChild(r2);
    const r3 = el('div', 'row-flex'); r3.style.marginTop = '6px';
    r3.appendChild(btn('Ban', () => { if (confirm('Ban ' + (d.name || name) + '?')) act('/api/ban', { ch, seconds: 0 }, 'Banned').then(ok => ok && bg.remove()); }, 'danger'));
    if (d.banned) r3.appendChild(btn('Unban', () => act('/api/unban', { ch }, 'Unbanned').then(ok => ok && bg.remove())));
    r3.appendChild(btn('Make moderator', () => { if (confirm('Make ' + (d.name || name) + ' a moderator?')) act('/api/mod', { ch }, 'Now a moderator'); }));
    m.appendChild(r3);
  }

  m.appendChild(el('div', 'uc-sec', 'This stream (' + d.session.length + ')'));
  const h1 = el('div', 'uc-hist');
  if (!d.session.length) h1.appendChild(el('div', 'muted', 'No messages yet.'));
  for (const x of d.session.slice().reverse()) {
    const row = el('div'); row.appendChild(el('span', 'ts', fmtTime(x.ts)));
    if (x.amount) row.appendChild(el('b', null, x.amount + ' '));
    const t = segsNode(x.segs); if (x.deleted) t.style.textDecoration = 'line-through';
    row.appendChild(t);
    if (connected && x.can_delete && !x.deleted && ch !== cfg.channel_id) {
      const del = el('button', null, '🗑'); del.style.cssText = 'float:right;padding:0 5px;border:0;background:none';
      del.title = 'Delete'; del.onclick = () => act('/api/delete', { id: x.id }, 'Message deleted').then(ok => ok && (t.style.textDecoration = 'line-through'));
      row.appendChild(del);
    }
    h1.appendChild(row);
  }
  m.appendChild(h1);
  const older = d.history;
  if (older.length) {
    m.appendChild(el('div', 'uc-sec', 'Earlier streams'));
    const h2 = el('div', 'uc-hist');
    for (const x of older.slice(0, 100)) {
      const row = el('div'); row.appendChild(el('span', 'ts', new Date(x.ts).toLocaleDateString() + ' ' + fmtTime(x.ts)));
      row.appendChild(document.createTextNode((x.amount ? x.amount + ' ' : '') + (x.text || ''))); h2.appendChild(row);
    }
    m.appendChild(h2);
  }
  const close = btn('Close', () => bg.remove()); close.style.marginTop = '10px'; m.appendChild(close);
  bg.appendChild(m); document.body.appendChild(bg);
}

// ---------- settings
$('#gear').onclick = () => {
  const bg = el('div', 'modal-bg'), m = el('div', 'modal');
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  m.innerHTML = `<h3>Chat settings</h3>
    <label class="lbl">Text size: <span id="fsv"></span>px</label><input id="fs" type="range" min="11" max="22" style="width:100%">
    <label class="lbl"><input id="tsC" type="checkbox"> Show timestamps</label>
    <label class="lbl"><input id="avC" type="checkbox"> Show profile pictures</label>
    <label class="lbl">Highlight messages containing (one per line). Your channel name is always highlighted.</label>
    <textarea id="hw" rows="4" style="width:100%"></textarea>
    <label class="lbl">Quick time-out button length</label>
    <select id="tod"><option value="60">1 minute</option><option value="300">5 minutes</option><option value="600">10 minutes</option><option value="3600">1 hour</option><option value="86400">24 hours</option></select>
    <div class="row-flex" style="margin-top:12px"><button id="sv" class="primary">Save</button><button id="cx">Cancel</button></div>`;
  bg.appendChild(m); document.body.appendChild(bg);
  $('#fs', m).value = cfg.font_size || 14; $('#fsv', m).textContent = $('#fs', m).value;
  $('#fs', m).oninput = () => { $('#fsv', m).textContent = $('#fs', m).value; document.documentElement.style.setProperty('--fs', $('#fs', m).value + 'px'); };
  $('#tsC', m).checked = !!cfg.show_timestamps; $('#avC', m).checked = !!cfg.show_avatars;
  $('#hw', m).value = (cfg.highlight_words || []).join('\n'); $('#tod', m).value = String(cfg.timeout_default || 300);
  $('#cx', m).onclick = () => { applySettings(); bg.remove(); };
  $('#sv', m).onclick = async () => {
    const body = { font_size: +$('#fs', m).value, show_timestamps: $('#tsC', m).checked, show_avatars: $('#avC', m).checked,
      highlight_words: $('#hw', m).value.split('\n').map(s => s.trim()).filter(Boolean), timeout_default: +$('#tod', m).value };
    if (await act('/api/settings', body, 'Saved')) bg.remove();
  };
};

// ---------- viewers in the top bar
async function pollViewers() {
  try { const s = await api('/api/stats'); $('#viewers').textContent = s.viewers != null ? '👁 ' + fmtNum(s.viewers) : ''; } catch (e) { }
}
setInterval(pollViewers, 30000);

// ---------- live events
connect(ev => {
  switch (ev.type) {
    case 'hello':
      cfg = ev.config; status = ev.status; connected = ev.connected;
      applySettings(); statusPill($('#pill'), status);
      list.innerHTML = ''; ev.recent.forEach(e => add(e, true)); list.scrollTop = list.scrollHeight;
      if (!status.video) add({ kind: 'system', segs: [{ t: status.state === 'nochannel'
        ? 'Open the Setup panel to connect your YouTube channel.'
        : 'Waiting for your stream to start. Chat will appear here automatically.' }] });
      pollViewers();
      break;
    case 'msg': add(ev); break;
    case 'replace': {
      const old = list.querySelector('[data-id="' + CSS.escape(ev.id) + '"]');
      if (old) old.replaceWith(render(ev));
      break;
    }
    case 'delete':
      for (const r of list.children) if ((ev.id && r.dataset.id === ev.id) || (ev.ch && r.dataset.ch === ev.ch)) r.classList.add('del');
      break;
    case 'clear': list.innerHTML = ''; add({ kind: 'system', segs: [{ t: 'Connected to chat.' }] }); break;
    case 'status': status = ev; connected = ev.connected; statusPill($('#pill'), status); applySettings(); break;
    case 'settings': cfg = ev.config; connected = ev.connected; applySettings(); break;
    case 'disconnected': statusPill($('#pill'), { state: 'disconnected' }); break;
  }
});
</script>
</body>
</html>
