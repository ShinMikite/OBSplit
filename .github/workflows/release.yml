name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          ./installer/build.ps1 -Version $v

      - uses: actions/upload-artifact@v4
        with:
          name: OBSplit-installer
          path: dist/*.exe

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          # release notes = this version's section of CHANGELOG.md, plus the installer's checksum
          $ver = $env:GITHUB_REF_NAME.TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($ver))\b" | Select-Object -First 1).LineNumber
          $body = if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $next = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            ($(if ($next) { $rest[0..($next - 2)] } else { $rest })) -join "`n"
          } else { "" }
          $notes = "$body`n`n**Download** ``$($exe.Name)`` below, close OBS, and run it. See the README for details.`n`nSHA-256: ``$hash``"
          Set-Content release-notes.md $notes -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" $exe.FullName --title "OBSplit $env:GITHUB_REF_NAME" --notes-file release-notes.md
